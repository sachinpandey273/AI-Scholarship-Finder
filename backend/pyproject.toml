[project]
name = "scholarship-finder-api"
version = "0.1.0"
requires-python = ">=3.11"
dependencies = [
  "fastapi>=0.115,<1.0", "uvicorn[standard]>=0.30,<1.0",
  "pydantic-settings>=2.6,<3.0", "SQLAlchemy>=2.0,<2.1",
  "psycopg[binary]>=3.2,<4.0", "alembic>=1.14,<2.0",
  "PyJWT[crypto]>=2.10,<3.0", "httpx>=0.28,<1.0", "python-multipart>=0.0.18,<1.0",
  "redis>=5.2,<6.0", "celery>=5.4,<6.0", "langgraph>=0.2,<1.0", "langchain-google-genai>=2.0,<4.0"
]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py311"
