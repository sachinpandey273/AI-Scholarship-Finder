
services:
  - type: web
    name: scholarship-finder-api
    runtime: docker
    region: singapore
    plan: free
    dockerContext: backend
    dockerfilePath: backend/Dockerfile
    healthCheckPath: /healthz
    preDeployCommand: alembic upgrade head
    envVars:
      - key: ENVIRONMENT
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: scholarship-finder-db
          property: connectionString
      - key: REDIS_URL
        fromService:
          name: scholarship-finder-redis
          type: keyvalue
          property: connectionString
      - key: JWT_ISSUER
        sync: false
      - key: JWT_AUDIENCE
        sync: false
      - key: JWT_PUBLIC_KEY
        sync: false
      - key: GEMINI_API_KEY
        sync: false
      - key: ALLOWED_ORIGINS
        sync: false

  - type: web
    name: scholarship-finder-web
    runtime: docker
    region: singapore
    plan: free
    dockerContext: frontend
    dockerfilePath: frontend/Dockerfile
    envVars:
      - key: NEXT_PUBLIC_API_BASE_URL
        sync: false

  - type: keyvalue
    name: scholarship-finder-redis
    plan: free
    maxmemoryPolicy: noeviction
    ipAllowList: []

databases:
  - name: scholarship-finder-db
    region: singapore
    plan: free
    databaseName: scholarship
    user: scholarship
    ipAllowList: []
